# OpenSSF Scorecard. A failure to run the analysis fails the job.
# A low score does not fail CI: several checks only turn green after the org
# owner enables branch protection and token settings, which would deadlock a
# required check. Results are uploaded to code scanning when that feature is on.

name: OpenSSF Scorecard

on:
  workflow_call:
    inputs:
      check-name:
        description: Stable check name for branch protection.
        required: false
        type: string
        default: OpenSSF Scorecard
    secrets:
      repo-token:
        description: Optional PAT for private repositories. Leave unset to use the workflow token. Never logged.
        required: false

permissions:
  actions: read
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: scorecard-${{ github.repository }}-${{ github.ref }}-${{ inputs.check-name }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: ${{ inputs.check-name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.repo-token || github.token }}
          publish_results: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref_name == github.event.repository.default_branch && github.event.repository.private == false }}

      - name: Require a SARIF result
        run: |
          set -euo pipefail
          if [ ! -s results.sarif ]; then
            echo "::error::Scorecard did not write results.sarif"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("results.sarif").read_text(encoding="utf-8"))
          runs = data.get("runs") or []
          if not runs:
              raise SystemExit("::error::Scorecard SARIF has no runs")
          print(f"Scorecard wrote {len(runs)} SARIF run(s)")
          PY

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Check whether code scanning is enabled
        id: features
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/code-scanning-body.txt"
          status="$(curl -sS -o "$body" -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1")"
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" = "403" ] || [ "$status" = "404" ]; then
            if grep -qiE 'code scanning is not enabled|Code Security must be enabled|Advanced Security|not enabled for this repository' "$body"; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Code scanning::Code scanning is not enabled. The Scorecard SARIF artifact is still available on this run."
              exit 0
            fi
          fi
          echo "::error::Could not tell whether code scanning is enabled (HTTP ${status})."
          python3 - "$body" <<'PY'
          import pathlib
          import sys
          print(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")[:2000])
          PY
          exit 1

      - name: Upload Scorecard SARIF to code scanning
        if: steps.features.outputs.enabled == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: scorecard
