# Secret scanning with gitleaks. The binary is verified against a published checksum.
# Findings fail the job. Matches are redacted in the log.

name: Gitleaks

on:
  workflow_call:
    inputs:
      check-name:
        description: Stable check name for branch protection.
        required: false
        type: string
        default: Gitleaks
      config-path:
        description: Optional path to a gitleaks config. Empty uses the default rules and a repo .gitleaks.toml when one exists.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.repository }}-${{ github.ref }}-${{ inputs.check-name }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: ${{ inputs.check-name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          case "$(uname -m)" in
            x86_64)
              asset="gitleaks_${version}_linux_x64.tar.gz"
              sha="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
              ;;
            aarch64)
              asset="gitleaks_${version}_linux_arm64.tar.gz"
              sha="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
              ;;
            *)
              echo "::error::Unsupported architecture $(uname -m)"
              exit 1
              ;;
          esac
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}"
          curl -fsSL --retry 3 --retry-delay 2 "$url" -o "${workdir}/gitleaks.tar.gz"
          echo "${sha}  ${workdir}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${workdir}/gitleaks.tar.gz" -C "$workdir" gitleaks
          install_dir="${HOME}/.local/bin"
          mkdir -p "$install_dir"
          install -m 0755 "${workdir}/gitleaks" "${install_dir}/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"
          "${install_dir}/gitleaks" version

      - name: Scan git history
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          set -euo pipefail
          args=(detect --source "$GITHUB_WORKSPACE" --redact --no-banner --exit-code 1)
          if [ -n "$CONFIG_PATH" ]; then
            if [ ! -f "$CONFIG_PATH" ]; then
              echo "::error::gitleaks config not found: ${CONFIG_PATH}"
              exit 1
            fi
            args+=(--config "$CONFIG_PATH")
          fi
          gitleaks "${args[@]}"
