name: Stage Shards showcase video (one-time)

on:
  push:
    branches: [fix/showcase-real-video-assets-20261104]
    paths:
      - .github/workflows/stage-showcase-video.yml

permissions:
  contents: write

concurrency:
  group: stage-showcase-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    name: Download, encode and commit verified showcase assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Retrieve original user-supplied video and validate its checksum
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 \
            "https://d2ol7oe51mr4n9.cloudfront.net/user_31jE5qhxHS4NjqcBP7Xrnz1LjgB/855733d2-682d-429b-9899-07324e5cfd51.mp4" \
            --output "${RUNNER_TEMP}/shards-video-original.mp4"
          printf '%s  %s\n' \
            '9ed3fd8510ab149a6d7e87c050f0a8b27e84ba7c2e6f57596f566620d7cfb96f' \
            "${RUNNER_TEMP}/shards-video-original.mp4" | sha256sum --check

      - name: Build full-length GitHub-readable animation and playable MP4
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p profile/assets
          ffmpeg -hide_banner -loglevel error -y \
            -i "${RUNNER_TEMP}/shards-video-original.mp4" \
            -map 0:v:0 -map 0:a:0? \
            -vf 'scale=960:-2:flags=lanczos' \
            -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            profile/assets/shards-showcase.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -i "${RUNNER_TEMP}/shards-video-original.mp4" \
            -filter_complex '[0:v]fps=8,scale=480:-2:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=48:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=4:diff_mode=rectangle' \
            -loop 0 profile/assets/shards-showcase.gif

      - name: Assert real visual output and video duration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          gif = Path("profile/assets/shards-showcase.gif")
          mp4 = Path("profile/assets/shards-showcase.mp4")
          assert gif.stat().st_size > 100_000, "animation output unexpectedly small"
          assert mp4.stat().st_size > 100_000, "MP4 output unexpectedly small"
          assert gif.read_bytes()[:6] in (b"GIF89a", b"GIF87a")
          with mp4.open("rb") as handle:
              assert handle.read(12)[4:8] == b"ftyp"
          for media in (gif, mp4):
              duration = float(subprocess.check_output(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "default=noprint_wrappers=1:nokey=1", str(media)],
                  text=True,
              ).strip())
              assert 14.0 <= duration <= 16.0, (media, duration)
              print(media, "duration=", duration, "bytes=", media.stat().st_size)
          PY

      - name: Commit assets to the pull request branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/assets/shards-showcase.gif profile/assets/shards-showcase.mp4
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "assets(profile): add real animated Shards showcase and playable video"
          git push origin "HEAD:${GITHUB_REF_NAME}"
