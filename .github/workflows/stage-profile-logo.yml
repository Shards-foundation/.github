name: Stage organisation profile GIF

on:
  push:
    branches:
      - docs/refresh-organisation-profile-animated-logo-20261104
    paths:
      - .github/workflows/stage-profile-logo.yml

permissions:
  contents: write

jobs:
  stage-profile-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify original user-provided GIF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profile/assets
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 15 \
            "https://d2ol7oe51mr4n9.cloudfront.net/user_31jE5qhxHS4NjqcBP7Xrnz1LjgB/d44e0035-2f6f-4e28-b837-d7f3134fd86a.gif" \
            --output profile/assets/shards-inc-animated.gif
          echo "7a733fb2b69505351fdd36fac15edb31bde6418451f7a8fc7625e083a31194d9  profile/assets/shards-inc-animated.gif" | sha256sum --check
          test "$(head -c 6 profile/assets/shards-inc-animated.gif)" = "GIF89a"
      - name: Commit verified GIF to profile branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/assets/shards-inc-animated.gif
          if git diff --cached --quiet; then
            echo "Logo already committed"
            exit 0
          fi
          git commit -m "docs(profile): add original Shards animated logo"
          git push origin "HEAD:${GITHUB_REF_NAME}"
