name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "20 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: Shards-foundation/.github/.github/workflows/codeql.yml@main
