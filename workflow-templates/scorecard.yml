name: OpenSSF Scorecard

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: OpenSSF Scorecard
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: Shards-foundation/.github/.github/workflows/scorecard.yml@main
